<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小妖の小窝 · 高级控制台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --text-sub: #86868b;
    --border: #e5e5ea;
    --blue: #0071e3;
    --red: #ff3b30;
    --green: #34c759;
    --gold: #d4af37;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
  body { 
    background: var(--bg); color: var(--text); font-family: var(--font); 
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    letter-spacing: -0.01em; padding: 30px 20px; overflow-x: hidden;
  }

  /* 登录卡片 */
  #login-screen {
    display: flex; justify-content: center; align-items: center;
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
  }
  .login-card { 
    width: 100%; max-width: 380px; padding: 48px; background: var(--surface);
    border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); border: 1px solid var(--border);
  }
  .login-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 32px; letter-spacing: -0.5px; }
  .input-field {
    width: 100%; padding: 16px; margin-bottom: 16px; font-size: 15px;
    background: #f5f5f7; border: 1px solid transparent; border-radius: 12px; color: var(--text); outline: none; transition: 0.2s;
  }
  .input-field:focus { background: var(--surface); border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }
  .btn-primary {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 600; color: #fff;
    background: var(--text); border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-top: 8px;
  }
  .btn-primary:hover { background: #333; }
  .err-msg { color: var(--red); font-size: 13px; text-align: center; margin-top: 16px; display: none; }

  /* 主界面 */
  #app-screen { display: none; width: 100%; max-width: 1000px; }

  /* 悬浮顶栏 (高级白毛玻璃) */
  .nav-bar {
    position: sticky; top: 10px; z-index: 50; background: rgba(255,255,255,0.85);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
  }
  .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  /* 头像带有高级感外圈 */
  .avatar-ring {
    width: 38px; height: 38px; border-radius: 50%;
    padding: 2px; background: #e5e5ea; transition: 0.3s;
    display: flex; justify-content: center; align-items: center;
  }
  .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .avatar-ring.super { background: linear-gradient(135deg, #d4af37, #f5c518); box-shadow: 0 0 15px rgba(212,175,55,0.3); }

  .badge { font-size: 11px; background: #e5e5ea; color: var(--text-sub); padding: 2px 8px; border-radius: 10px; font-weight: 600; display: none; }
  .badge.super { display: inline-block; background: rgba(212,175,55,0.1); color: var(--gold); }
  
  .nav-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-sub); margin-left: 32px; margin-right: auto; }
  .nav-stats span strong { color: var(--text); font-weight: 600; }

  .btn-super {
    background: #f5f5f7; border: 1px solid transparent; color: var(--text-sub);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.3s;
  }
  .btn-super:hover { color: var(--text); }
  .btn-super.active { background: var(--surface); border-color: var(--gold); color: var(--gold); }

  /* 选项卡 (极简下划线) */
  .tabs { display: flex; gap: 32px; border-bottom: 1px solid var(--border); margin-bottom: 40px; overflow-x: auto; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding-bottom: 16px; font-size: 15px; font-weight: 500; color: var(--text-sub); cursor: pointer; position: relative; transition: 0.3s; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); }
  .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--text); }
  .tab.locked { opacity: 0.3; cursor: not-allowed; }

  /* 面板 */
  .panel { display: none; background: var(--surface); border-radius: 24px; padding: 40px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
  .panel.active { display: block; }
  .section-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
  .section-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 32px; }

  /* 表单 */
  .form-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 250px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .form-input {
    width: 100%; padding: 16px; font-size: 14px; color: var(--text);
    background: #f5f5f7; border: 1px solid transparent; border-radius: 12px; outline: none; transition: 0.2s;
  }
  .form-input:focus { background: var(--surface); border-color: var(--blue); }
  textarea.form-input { min-height: 120px; resize: vertical; }
  
  .upload-zone {
    border: 2px dashed var(--border); border-radius: 16px; padding: 40px; text-align: center;
    background: #fbfbfd; transition: 0.3s; cursor: pointer; position: relative;
  }
  .upload-zone:hover { border-color: var(--text-sub); background: #f5f5f7; }
  .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 10; }
  .upload-text { font-size: 14px; color: var(--text-sub); }
  
  .progress-container { margin-top: 16px; display: none; background: #e5e5ea; border-radius: 10px; height: 4px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: var(--green); transition: width 0.3s; }

  .btn-action {
    background: var(--text); color: #fff; border: none; border-radius: 12px;
    padding: 14px 28px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .btn-action:hover { background: #333; }
  .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-action.red { background: rgba(255,59,48,0.1); color: var(--red); }
  .btn-action.red:hover { background: rgba(255,59,48,0.2); }

  /* 列表 */
  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0; border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  .item-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
  .item-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .item-title { font-size: 16px; font-weight: 600; }
  .item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  
  .btn-tool {
    background: #f5f5f7; border: 1px solid transparent; color: var(--text);
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s;
  }
  .btn-tool:hover { background: #e5e5ea; }
  .btn-tool.primary { color: var(--blue); background: rgba(0,113,227,0.1); }
  .btn-tool.gold { color: var(--gold); background: rgba(212,175,55,0.1); font-weight: 600; }
  .btn-tool.danger { color: var(--red); background: rgba(255,59,48,0.1); }

  .checkbox { width: 18px; height: 18px; accent-color: var(--text); cursor: pointer; }

  /* 网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; margin-top: 20px; }
  .grid-item { position: relative; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: #f5f5f7; border: 1px solid var(--border); }
  .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
  .grid-item .caption { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); color: #000; font-size: 11px; padding: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; backdrop-filter: blur(4px); border-top: 1px solid var(--border); }
  .grid-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 20; }
  .grid-btn {
    width: 24px; height: 24px; background: rgba(255,255,255,0.9); color: #000; border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .grid-btn:hover { background: var(--text); color: #fff; }
  .grid-btn.del:hover { background: var(--red); color: #fff; border-color: var(--red); }

  /* 反馈卡片 */
  .fb-card { background: #fbfbfd; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
  .fb-content { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 12px; }
  .fb-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-sub); border-top: 1px solid var(--border); padding-top: 12px; }
  .fb-del { background: transparent; border: none; color: var(--red); font-size: 12px; cursor: pointer; }

  .status { font-size: 13px; margin-top: 12px; font-weight: 500; display: none; }
  .status.ok { display: block; color: var(--green); }
  .status.err { display: block; color: var(--red); }
  .status.load { display: block; color: var(--text-sub); }

  /* 弹窗 */
  #video-modal, #image-modal {
    position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
  }
  #video-modal.show, #image-modal.show { opacity: 1; }
  .modal-container {
    background: var(--surface); padding: 16px; border-radius: 20px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.15); width: 90%; max-width: 800px; position: relative;
  }
  .modal-container video, .modal-container img { width: 100%; border-radius: 12px; display: block; max-height: 80vh; object-fit: contain; background: #000; }
  .btn-close-modal {
    position: absolute; top: -20px; right: -20px; width: 44px; height: 44px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s;
  }
  .btn-close-modal:hover { transform: scale(1.1); background: var(--red); color: #fff; }
</style>
</head>
<body>

<div id="video-modal">
  <div class="modal-container">
    <button class="btn-close-modal" onclick="closeModal('video-modal')">✕</button>
    <video id="modal-video" controls playsinline></video>
  </div>
</div>
<div id="image-modal">
  <div class="modal-container">
    <button class="btn-close-modal" onclick="closeModal('image-modal')">✕</button>
    <img id="modal-image" src="">
  </div>
</div>

<div id="login-screen">
  <div class="login-card" id="login-card">
    <div class="login-title">小妖の小窝</div>
    <input type="text" id="loginUser" class="input-field" placeholder="管理员账号">
    <input type="password" id="loginPass" class="input-field" placeholder="密码">
    <button class="btn-primary" onclick="doLogin()">进入控制台</button>
    <div class="err-msg" id="loginErr">账号或密码错误</div>
  </div>
</div>

<div id="app-screen">
  <div class="nav-bar">
    <div class="brand">
      <div class="avatar-ring" id="avatarRing">
        <img src="icon.jpg" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23e5e5ea\'/><text x=\'50\' y=\'55\' font-size=\'40\' text-anchor=\'middle\' fill=\'%2386868b\' dy=\'.3em\'>妖</text></svg>'">
      </div>
      控制台
      <span class="badge" id="roleBadge">高级</span>
    </div>
    
    <div class="nav-stats">
      <span>视频 <strong id="stV">-</strong></span>
      <span>图集 <strong id="stG">-</strong></span>
      <span>点赞 <strong id="stL">-</strong></span>
    </div>

    <div class="nav-actions">
      <button class="btn-super" id="superBtn" onclick="toggleSuper()">解锁高级</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-video" onclick="switchTab('video')">视频管理</div>
    <div class="tab" id="tab-gallery" onclick="switchTab('gallery')">图集管理</div>
    <div class="tab locked" id="tab-notice" onclick="switchTab('notice')">全站公告</div>
    <div class="tab locked" id="tab-feedback" onclick="switchTab('feedback')">用户反馈</div>
    <div class="tab locked" id="tab-appearance" onclick="switchTab('appearance')">页面背景</div>
  </div>

  <!-- 视频 -->
  <div class="panel active" id="panel-video">
    <div class="section-title">视频管理</div>
    <div class="section-desc">上传视频，修改标题，设置置顶。</div>
    
    <div class="form-row">
      <div class="form-group"><label class="form-label">视频标题</label><input type="text" id="videoTitle" class="form-input" placeholder="输入标题"></div>
    </div>
    
    <div class="upload-zone" id="videoZone">
      <input type="file" id="videoFile" accept="video/mp4,video/*">
      <div class="upload-text">拖拽或点击选择视频文件</div>
    </div>
    <div class="progress-container" id="videoProgress"><div class="progress-bar" id="videoBar"></div></div>
    
    <div style="display:flex; gap:12px; margin-top:24px;">
      <button class="btn-action" id="btnUploadVideo" onclick="uploadVideo()">上传视频</button>
      <button class="btn-action red" onclick="batchDeleteVideos()">批量删除</button>
    </div>
    <div class="status" id="videoStatus"></div>
    
    <div class="list-container" id="videoList" style="margin-top: 32px;"></div>
  </div>

  <!-- 图集 -->
  <div class="panel" id="panel-gallery">
    <div class="section-title">图集管理</div>
    <div class="section-desc">上传照片，添加描述。</div>
    
    <div class="upload-zone" id="galleryZone">
      <input type="file" id="galleryFiles" accept="image/*" multiple>
      <div class="upload-text">拖拽或点击选择图片</div>
    </div>
    <div class="progress-container" id="galleryProgress"><div class="progress-bar" id="galleryBar"></div></div>
    
    <div style="display:flex; gap:12px; margin-top:24px;">
      <button class="btn-action" id="btnUploadGallery" onclick="uploadGallery()">上传图集</button>
      <button class="btn-action red" onclick="batchDeleteGallery()">批量删除</button>
    </div>
    <div class="status" id="galleryStatus"></div>

    <div class="grid" id="galleryGrid"></div>
  </div>

  <!-- 公告 -->
  <div class="panel" id="panel-notice">
    <div class="section-title">全站公告</div>
    <div class="section-desc">在 App 启动时弹窗。留空则关闭公告。</div>
    <div class="form-group">
      <textarea id="noticeText" class="form-input" placeholder="输入公告内容..."></textarea>
    </div>
    <button class="btn-action" onclick="saveNotice()">保存公告</button>
    <div class="status" id="noticeStatus"></div>
  </div>

  <!-- 反馈 -->
  <div class="panel" id="panel-feedback">
    <div class="section-title">用户反馈</div>
    <div class="section-desc">来自前端主页的留言建议。</div>
    <div class="list-container" id="feedbackList"></div>
  </div>

  <!-- 页面背景 -->
  <div class="panel" id="panel-appearance">
    <div class="section-title">页面背景设置</div>
    <div class="section-desc">修改整个网站的视觉元素，涵盖每一个页面。</div>
    
    <div class="form-group">
      <label class="form-label">全站加载动画 (图/视频)</label>
      <input type="file" id="img_loading" accept="image/*,video/*" data-slot="loading">
      <div class="grid" id="grid_loading"></div>
    </div>
    <div class="form-group" style="margin-top: 30px;">
      <label class="form-label">头像</label>
      <input type="file" id="img_avatar" accept="image/*" data-slot="avatar">
      <div class="grid" id="grid_avatar"></div>
    </div>
    
    <div style="height:1px; background:var(--border); margin:30px 0;"></div>
    
    <div class="form-group">
      <label class="form-label">首页背景 (小妖的小窝)</label>
      <input type="file" id="img_home_bg" accept="image/*" data-slot="home_bg">
      <div class="grid" id="grid_home_bg"></div>
    </div>
    <div class="form-group" style="margin-top: 30px;">
      <label class="form-label">作品墙背景</label>
      <input type="file" id="img_works_bg" accept="image/*" data-slot="works_bg">
      <div class="grid" id="grid_works_bg"></div>
    </div>
    <div class="form-group" style="margin-top: 30px;">
      <label class="form-label">关于她背景</label>
      <input type="file" id="img_about_bg" accept="image/*" data-slot="about_bg">
      <div class="grid" id="grid_about_bg"></div>
    </div>
    <div class="form-group" style="margin-top: 30px;">
      <label class="form-label">学舞经历背景</label>
      <input type="file" id="img_dance_bg" accept="image/*" data-slot="dance_bg">
      <div class="grid" id="grid_dance_bg"></div>
    </div>
    <div class="form-group" style="margin-top: 30px;">
      <label class="form-label">关注页背景</label>
      <input type="file" id="img_contact_bg" accept="image/*" data-slot="contact_bg">
      <div class="grid" id="grid_contact_bg"></div>
    </div>
    <div class="form-group" style="margin-top: 30px;">
      <label class="form-label">微信/QQ分享封面</label>
      <input type="file" id="img_og_image" accept="image/*" data-slot="og_image">
      <div class="grid" id="grid_og_image"></div>
    </div>
    <div class="status" id="imgStatus"></div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://iadmzoukavnahjliorgq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8NhMWO807rD7xSVVyrPrcQ_1tpznF4I';
const ADMIN_USER = 'lhq';
const ADMIN_PASS = '0117';
const SUPER_PASS = 'ycx625110482';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
let isSuper = localStorage.getItem('is_super') === 'true';

window.addEventListener('DOMContentLoaded', () => {
  anime({ targets: '#login-card', opacity: [0, 1], scale: [0.95, 1], translateY: [20, 0], duration: 800, easing: 'easeOutCubic' });
});

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    anime({
      targets: '#login-screen', opacity: 0, duration: 400,
      complete: () => {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        initApp();
      }
    });
  } else {
    document.getElementById('loginErr').style.display = 'block';
    const card = document.getElementById('login-card');
    anime({ targets: card, translateX: [-10, 10, -10, 10, 0], duration: 400 });
  }
}
document.getElementById('loginPass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});

function initApp() {
  if (isSuper) enableSuperUI();
  loadVideos();
  loadGallery();
  loadStats();
}

function switchTab(tabId) {
  if (!isSuper && (tabId === 'notice' || tabId === 'feedback' || tabId === 'appearance')) {
    return alert('请先解锁高级管理员权限');
  }
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + tabId);
  panel.classList.add('active');
  
  anime({ targets: panel, opacity: [0, 1], translateY: [10, 0], duration: 400, easing: 'easeOutCubic' });

  if (tabId === 'feedback') loadFeedbacks();
}

function toggleSuper() {
  if (isSuper) {
    isSuper = false;
    localStorage.removeItem('is_super');
    document.getElementById('roleBadge').className = 'badge';
    document.getElementById('roleBadge').innerText = '普通';
    document.getElementById('avatarRing').classList.remove('super');
    document.getElementById('superBtn').classList.remove('active');
    document.getElementById('superBtn').innerHTML = '解锁高级';
    document.getElementById('tab-notice').classList.add('locked');
    document.getElementById('tab-feedback').classList.add('locked');
    document.getElementById('tab-appearance').classList.add('locked');
    switchTab('video');
  } else {
    const pwd = prompt('请输入二级管理员密码：');
    if (pwd === SUPER_PASS) {
      isSuper = true;
      localStorage.setItem('is_super', 'true');
      enableSuperUI();
    } else if (pwd !== null) {
      alert('密码错误');
    }
  }
}

function enableSuperUI() {
  document.getElementById('roleBadge').className = 'badge super';
  document.getElementById('roleBadge').innerText = '高级';
  document.getElementById('avatarRing').classList.add('super');
  document.getElementById('superBtn').classList.add('active');
  document.getElementById('superBtn').innerHTML = '⭐ 高级管理员';
  document.getElementById('tab-notice').classList.remove('locked');
  document.getElementById('tab-feedback').classList.remove('locked');
  document.getElementById('tab-appearance').classList.remove('locked');
  loadNotice();
  loadSiteImages();
}

async function loadStats() {
  const { count: vCount } = await db.from('videos').select('*', { count: 'exact', head: true });
  document.getElementById('stV').innerText = vCount || 0;
  const { count: gCount } = await db.from('gallery').select('*', { count: 'exact', head: true });
  document.getElementById('stG').innerText = gCount || 0;
  const { data: lData } = await db.from('site_likes').select('count').eq('id', 1).single();
  document.getElementById('stL').innerText = (lData && lData.count) ? lData.count : 0;
}

function openVideo(url) {
  document.getElementById('modal-video').src = url;
  const modal = document.getElementById('video-modal');
  modal.style.display = 'flex';
  setTimeout(() => modal.classList.add('show'), 10);
  document.getElementById('modal-video').play();
}
function openImage(url) {
  document.getElementById('modal-image').src = url;
  const modal = document.getElementById('image-modal');
  modal.style.display = 'flex';
  setTimeout(() => modal.classList.add('show'), 10);
}
function closeModal(id) {
  const modal = document.getElementById(id);
  modal.classList.remove('show');
  setTimeout(() => {
    modal.style.display = 'none';
    if (id === 'video-modal') { 
      document.getElementById('modal-video').pause(); 
      document.getElementById('modal-video').src = ''; 
    }
  }, 300);
}

['videoZone', 'galleryZone'].forEach(id => {
  const zone = document.getElementById(id);
  const input = zone.querySelector('input[type="file"]');
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.borderColor = 'var(--text)'; });
  zone.addEventListener('dragleave', () => { zone.style.borderColor = 'var(--border)'; });
  zone.addEventListener('drop', (e) => {
    e.preventDefault(); zone.style.borderColor = 'var(--border)';
    input.files = e.dataTransfer.files;
  });
});

async function uploadVideo() {
  const title = document.getElementById('videoTitle').value.trim() || '未命名';
  const file = document.getElementById('videoFile').files[0];
  if (!file) return showMsg('videoStatus', 'err', '请选择文件');
  
  document.getElementById('btnUploadVideo').disabled = true;
  showMsg('videoStatus', 'load', '正在上传...');
  
  const progressContainer = document.getElementById('videoProgress');
  const progressBar = document.getElementById('videoBar');
  progressContainer.style.display = 'block';
  
  try {
    let prog = 10;
    const interval = setInterval(() => { prog += 10; if (prog > 90) clearInterval(interval); else progressBar.style.width = prog + '%'; }, 200);

    const ext = file.name.split('.').pop() || 'mp4';
    const name = `v_${Date.now()}.${ext}`;
    await db.storage.from('videos').upload(name, file);
    clearInterval(interval); progressBar.style.width = '100%';
    
    const { data } = db.storage.from('videos').getPublicUrl(name);
    await db.from('videos').insert({ title, url: data.publicUrl, is_top: false });
    
    showMsg('videoStatus', 'ok', '上传成功');
    document.getElementById('videoTitle').value = '';
    document.getElementById('videoFile').value = '';
    loadVideos(); loadStats();
  } catch(e) { showMsg('videoStatus', 'err', e.message); }
  
  setTimeout(() => { document.getElementById('btnUploadVideo').disabled = false; progressContainer.style.display = 'none'; progressBar.style.width = '0%'; }, 1000);
}

async function loadVideos() {
  // 加入容错：如果没有 is_top 字段，退回到只按时间排序
  let data = [];
  let error = null;
  
  try {
    const res = await db.from('videos').select('*').order('created_at', { ascending: false });
    data = res.data || [];
    error = res.error;
  } catch (err) {
    error = err;
  }
  
  const list = document.getElementById('videoList');
  if (error) {
    list.innerHTML = `<div style="color:var(--red);font-size:14px;padding:20px 0;">加载失败: ${error.message} <br> (请检查 Supabase RLS 是否允许 Select)</div>`;
    return;
  }
  if (!data || data.length === 0) { list.innerHTML = '<div style="color:var(--text-sub);font-size:14px;padding:20px 0;">暂无视频</div>'; return; }

  // 前端手动排序：置顶的优先，其他的按时间
  data.sort((a, b) => {
    if (a.is_top && !b.is_top) return -1;
    if (!a.is_top && b.is_top) return 1;
    return new Date(b.created_at) - new Date(a.created_at);
  });
  
  list.innerHTML = data.map(v => `
    <div class="list-item">
      <div class="item-left">
        <input type="checkbox" class="checkbox video-cb" value="${v.id}" data-url="${v.url}">
        <div class="item-info">
          <div class="item-title">
            ${esc(v.title)} 
            ${v.is_top ? '<span style="font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:2px 6px;border-radius:4px;margin-left:6px;background:rgba(212,175,55,0.1);">置顶</span>' : ''}
          </div>
        </div>
      </div>
      <div class="item-actions">
        <button class="btn-tool primary" onclick="openVideo('${v.url}')">预览</button>
        <button class="btn-tool ${v.is_top ? 'gold' : ''}" onclick="toggleTop(${v.id}, ${v.is_top || false})">${v.is_top ? '取消置顶' : '置顶'}</button>
        <button class="btn-tool" onclick="copyLink('${v.url}')">复制链接</button>
        <button class="btn-tool" onclick="editVideoTitle(${v.id}, '${escAttr(v.title)}')">改名</button>
        <button class="btn-tool danger" onclick="delVideo(${v.id}, '${v.url}')">删除</button>
      </div>
    </div>
  `).join('');
}

async function toggleTop(id, currentStatus) {
  try {
    const { error } = await db.from('videos').update({ is_top: !currentStatus }).eq('id', id);
    if (error) throw error;
    loadVideos();
  } catch(e) {
    alert('置顶操作失败：\n' + e.message + '\n\n请确认已在 Supabase 运行了添加 is_top 字段的 SQL！');
  }
}

async function batchDeleteVideos() {
  const checked = document.querySelectorAll('.video-cb:checked');
  if (checked.length === 0) return alert('请先勾选视频');
  if (!confirm(`确定批量删除这 ${checked.length} 个视频吗？`)) return;
  for (let cb of checked) {
    await db.storage.from('videos').remove([cb.dataset.url.split('/').pop()]);
    await db.from('videos').delete().eq('id', cb.value);
  }
  loadVideos(); loadStats();
}

async function editVideoTitle(id, oldTitle) {
  const newTitle = prompt('修改视频标题：', oldTitle);
  if (newTitle && newTitle.trim() !== '' && newTitle !== oldTitle) {
    try {
      const { error } = await db.from('videos').update({ title: newTitle.trim() }).eq('id', id);
      if (error) throw error;
      loadVideos();
    } catch (e) {
      alert('修改失败：' + e.message + '\n请检查 Supabase 是否开启了 RLS 的 Update 权限！');
    }
  }
}

async function delVideo(id, url) {
  if (!confirm('⚠️ 确定要删除这个视频吗？')) return;
  await db.storage.from('videos').remove([url.split('/').pop()]);
  await db.from('videos').delete().eq('id', id);
  loadVideos(); loadStats();
}

async function uploadGallery() {
  const files = document.getElementById('galleryFiles').files;
  if (!files.length) return showMsg('galleryStatus', 'err', '请选择图片');
  document.getElementById('btnUploadGallery').disabled = true;
  
  const progressContainer = document.getElementById('galleryProgress');
  const progressBar = document.getElementById('galleryBar');
  progressContainer.style.display = 'block';
  
  for (let i=0; i<files.length; i++) {
    showMsg('galleryStatus', 'load', `上传中 ${i+1}/${files.length}...`);
    progressBar.style.width = `${((i+1)/files.length)*100}%`;
    try {
      const ext = files[i].name.split('.').pop() || 'jpg';
      const name = `g_${Date.now()}_${i}.${ext}`;
      await db.storage.from('videos').upload(name, files[i]);
      const { data } = db.storage.from('videos').getPublicUrl(name);
      await db.from('gallery').insert({ url: data.publicUrl, title: '' });
    } catch(e) {}
  }
  showMsg('galleryStatus', 'ok', '上传完成');
  document.getElementById('galleryFiles').value = '';
  document.getElementById('btnUploadGallery').disabled = false;
  setTimeout(() => progressContainer.style.display = 'none', 1000);
  loadGallery(); loadStats();
}

async function loadGallery() {
  const { data, error } = await db.from('gallery').select('*').order('created_at', { ascending: false });
  const grid = document.getElementById('galleryGrid');
  if (error) {
    grid.innerHTML = `<div style="color:var(--red);font-size:14px;">加载失败: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) { grid.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">暂无图片</div>'; return; }
  
  grid.innerHTML = data.map(g => `
    <div class="grid-item">
      <input type="checkbox" class="checkbox gallery-cb" value="${g.id}" data-url="${g.url}" style="position:absolute; top:6px; left:6px; z-index:10;">
      <img src="${g.url}" onclick="openImage('${g.url}')">
      ${g.title ? `<div class="caption">${esc(g.title)}</div>` : ''}
      <div class="grid-actions">
        <button class="grid-btn" onclick="copyLink('${g.url}')">🔗</button>
        <button class="grid-btn" onclick="editGalleryTitle(${g.id}, '${escAttr(g.title || '')}')">✎</button>
        <button class="grid-btn del" onclick="delGallery(${g.id}, '${g.url}')">✕</button>
      </div>
    </div>
  `).join('');
}

async function batchDeleteGallery() {
  const checked = document.querySelectorAll('.gallery-cb:checked');
  if (checked.length === 0) return alert('请先勾选图片');
  if (!confirm(`确定批量删除这 ${checked.length} 张图片吗？`)) return;
  for (let cb of checked) {
    await db.storage.from('videos').remove([cb.dataset.url.split('/').pop()]);
    await db.from('gallery').delete().eq('id', cb.value);
  }
  loadGallery(); loadStats();
}

async function editGalleryTitle(id, oldTitle) {
  const newTitle = prompt('为这张照片添加一段描述：', oldTitle);
  if (newTitle !== null && newTitle !== oldTitle) {
    try {
      const { error } = await db.from('gallery').update({ title: newTitle.trim() }).eq('id', id);
      if (error) throw error;
      loadGallery();
    } catch (e) {
      alert('修改失败：' + e.message + '\n请检查 Supabase 是否开启了 RLS 的 Update 权限！');
    }
  }
}

async function delGallery(id, url) {
  if (!confirm('确定删除这张图片？')) return;
  await db.storage.from('videos').remove([url.split('/').pop()]);
  await db.from('gallery').delete().eq('id', id);
  loadGallery(); loadStats();
}

async function saveNotice() {
  const text = document.getElementById('noticeText').value.trim();
  showMsg('noticeStatus', 'load', '保存中...');
  try {
    await db.from('site_images').delete().eq('slot', 'notice');
    if (text) await db.from('site_images').insert({ slot: 'notice', url: text });
    showMsg('noticeStatus', 'ok', '保存成功');
  } catch(e) { showMsg('noticeStatus', 'err', '保存失败'); }
}

async function loadNotice() {
  const { data } = await db.from('site_images').select('url').eq('slot', 'notice').single();
  document.getElementById('noticeText').value = (data && data.url) ? data.url : '';
}

async function loadFeedbacks() {
  const list = document.getElementById('feedbackList');
  list.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">加载中...</div>';
  try {
    const { data, error } = await db.from('feedbacks').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    if (!data || data.length === 0) { list.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">暂无反馈</div>'; return; }
    
    list.innerHTML = data.map(f => `
      <div class="fb-card">
        <div class="fb-content">${esc(f.content).replace(/\n/g, '<br>')}</div>
        <div class="fb-meta">
          <span>联系: ${esc(f.contact || '无')} | ${new Date(f.created_at).toLocaleString()}</span>
          <button class="fb-del" onclick="delFeedback(${f.id})">删除</button>
        </div>
      </div>
    `).join('');
  } catch(e) { list.innerHTML = `<div style="color:var(--red);font-size:14px;">加载失败: ${esc(e.message)}</div>`; }
}

async function delFeedback(id) {
  if (!confirm('确定删除这条反馈？')) return;
  try {
    const { error } = await db.from('feedbacks').delete().eq('id', id);
    if (error) throw error;
    loadFeedbacks();
  } catch(e) { alert('删除失败：' + e.message); }
}

document.querySelectorAll('input[data-slot]').forEach(input => {
  input.addEventListener('change', async () => {
    if (!isSuper) return;
    const file = input.files[0];
    if (!file) return;
    const slot = input.dataset.slot;
    showMsg('imgStatus', 'load', '上传中...');
    try {
      const ext = file.name.split('.').pop();
      const name = `bg_${slot}_${Date.now()}.${ext}`;
      await db.storage.from('videos').upload(name, file);
      const { data } = db.storage.from('videos').getPublicUrl(name);
      await db.from('site_images').delete().eq('slot', slot);
      await db.from('site_images').insert({ slot, url: data.publicUrl });
      showMsg('imgStatus', 'ok', '更新成功');
      loadSiteImages();
    } catch(e) { showMsg('imgStatus', 'err', '失败: ' + e.message); }
  });
});

async function loadSiteImages() {
  const { data } = await db.from('site_images').select('*');
  if (!data) return;
  const map = {};
  data.forEach(d => map[d.slot] = d.url);
  
  ['loading', 'avatar', 'home_bg', 'works_bg', 'about_bg', 'dance_bg', 'contact_bg', 'og_image'].forEach(slot => {
    const el = document.getElementById(`grid_${slot}`);
    if (!el) return;
    if (map[slot]) {
      const isVid = map[slot].match(/\.(mp4|webm|mov)/i);
      el.innerHTML = `
        <div class="grid-item" style="grid-column:1/-1; height:100px; aspect-ratio:auto;">
          ${isVid ? `<video src="${map[slot]}" muted autoplay loop></video>` : `<img src="${map[slot]}">`}
          <button class="grid-btn del" style="position:absolute; top:6px; right:6px;" onclick="delSiteImage('${slot}', '${map[slot]}')">✕</button>
        </div>
      `;
    } else {
      el.innerHTML = '<div style="color:var(--text-sub);font-size:12px; grid-column:1/-1;">未设置</div>';
    }
  });
}

async function delSiteImage(slot, url) {
  if (!confirm('确认删除此图片？')) return;
  await db.storage.from('videos').remove([url.split('/').pop()]);
  await db.from('site_images').delete().eq('slot', slot);
  loadSiteImages();
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => alert('链接已复制！')).catch(() => alert('复制失败，请手动复制。'));
}
function showMsg(id, type, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'status ' + type;
  el.innerText = text;
  if (type === 'ok') setTimeout(() => el.style.display = 'none', 3000);
}
function esc(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
</body>
</html>
