<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小妖の小窝 - 后台管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
  body { 
    background-color: #000000; 
    color: #f5f5f7; 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 60px 20px;
  }

  /* 登录界面 (极简风) */
  #login-screen { width: 100%; max-width: 340px; margin-top: 10vh; display: none; }
  .login-title { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; text-align: center; margin-bottom: 30px; }
  
  .input-wrap { background: #1c1c1e; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .input-row { display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #333; }
  .input-row:last-child { border-bottom: none; }
  .input-row input { 
    width: 100%; height: 52px; background: transparent; border: none; outline: none; 
    color: #fff; font-size: 16px; 
  }
  .input-row input::placeholder { color: #666; }
  
  .btn-login { 
    width: 100%; height: 50px; border-radius: 12px; background: #007aff; color: #fff; 
    font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s;
  }
  .btn-login:active { background: #005bb5; transform: scale(0.98); }
  .error-msg { color: #ff453a; font-size: 13px; text-align: center; margin-top: 16px; display: none; }

  /* 主界面 */
  #admin-screen { width: 100%; max-width: 600px; display: none; }
  
  /* 顶部导航 */
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; padding-bottom: 16px; border-bottom: 1px solid #333; }
  .header-left { display: flex; flex-direction: column; gap: 4px; }
  .title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .role-tag { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  
  .btn-super { 
    background: transparent; border: 1px solid #333; color: #aaa; 
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: 0.2s; 
  }
  .btn-super.active { border-color: #ff9f0a; color: #ff9f0a; }

  /* 模块分组 */
  .section { margin-bottom: 40px; }
  .section-title { font-size: 13px; color: #888; font-weight: 500; margin-bottom: 12px; padding-left: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  /* 列表式面板 (iOS 风格) */
  .list-group { background: #1c1c1e; border-radius: 16px; overflow: hidden; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #333; transition: 0.2s; }
  .list-item:last-child { border-bottom: none; }
  .item-info { display: flex; flex-direction: column; gap: 4px; }
  .item-name { font-size: 15px; color: #fff; font-weight: 500; }
  .item-sub { font-size: 12px; color: #888; }
  
  /* 按钮样式 */
  .btn-action { 
    background: #2c2c2e; color: #fff; border: none; padding: 10px 20px; 
    border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s;
  }
  .btn-action:active { background: #3a3a3c; }
  .btn-action.primary { background: #007aff; }
  .btn-action.primary:active { background: #005bb5; }
  .btn-danger { background: transparent; color: #ff453a; border: none; font-size: 14px; cursor: pointer; }

  /* 表单 */
  .form-group { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .form-input { 
    width: 100%; background: #2c2c2e; border: 1px solid transparent; border-radius: 10px; 
    padding: 14px; color: #fff; font-size: 15px; outline: none; transition: 0.2s;
  }
  .form-input:focus { border-color: #007aff; background: #1c1c1e; }
  textarea.form-input { resize: none; min-height: 80px; }
  input[type="file"] { font-size: 13px; color: #aaa; padding: 10px 0; }

  /* 网格图片 */
  .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; padding: 16px; background: #1c1c1e; border-radius: 16px; margin-top: 10px; }
  .grid-img-box { position: relative; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: #000; }
  .grid-img-box img, .grid-img-box video { width: 100%; height: 100%; object-fit: cover; }
  .grid-del { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer; backdrop-filter: blur(4px); }

  /* 状态提示 */
  .status { padding: 12px 16px; font-size: 13px; display: none; }
  .status.ok { display: block; color: #32d74b; }
  .status.err { display: block; color: #ff453a; }
  .status.load { display: block; color: #0a84ff; }

  /* 视频全屏预览弹窗 */
  #video-modal {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; opacity: 0;
  }
  .video-container { width: 100%; max-width: 800px; position: relative; padding: 0 20px; }
  .video-container video { width: 100%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: block; }
  .close-modal { position: absolute; top: -40px; right: 20px; color: #fff; font-size: 24px; cursor: pointer; background: none; border: none; }
</style>
</head>
<body>

<!-- 视频预览弹窗 -->
<div id="video-modal">
  <div class="video-container">
    <button class="close-modal" onclick="closeVideoModal()">✕</button>
    <video id="modal-video" controls></video>
  </div>
</div>

<!-- 登录界面 -->
<div id="login-screen">
  <h1 class="login-title">小妖の小窝</h1>
  <div class="input-wrap">
    <div class="input-row">
      <input type="text" id="loginUser" placeholder="账号">
    </div>
    <div class="input-row">
      <input type="password" id="loginPass" placeholder="密码">
    </div>
  </div>
  <button class="btn-login" onclick="handleLogin()">登录</button>
  <div class="error-msg" id="loginErr">账号或密码错误</div>
</div>

<!-- 主管理界面 -->
<div id="admin-screen">
  <div class="header">
    <div class="header-left">
      <span class="title">控制台</span>
      <span class="role-tag" id="role-badge">普通管理员</span>
    </div>
    <button class="btn-super" id="super-btn" onclick="toggleSuper()">二级权限</button>
  </div>

  <!-- 二级管理员专属 -->
  <div id="super-zone" style="display: none;">
    <div class="section">
      <div class="section-title">全站公告</div>
      <div class="list-group">
        <div class="form-group">
          <textarea id="noticeText" class="form-input" placeholder="输入公告内容..."></textarea>
          <button class="btn-action primary" onclick="saveNotice()" style="width: 100px; align-self: flex-end;">保存</button>
        </div>
        <div class="status" id="noticeStatus"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">站点外观设置</div>
      <div class="list-group">
        <div class="form-group">
          <span style="font-size: 13px; color: #888;">全站加载动画</span>
          <input type="file" id="img_loading" accept="image/*,video/*" data-slot="loading">
          <div class="image-grid" id="grid_loading" style="padding: 8px; margin-top: 8px;"></div>
        </div>
        <div class="form-group" style="border-top: 1px solid #333;">
          <span style="font-size: 13px; color: #888;">全局背景</span>
          <input type="file" id="img_global_bg" accept="image/*" data-slot="global_bg">
          <div class="image-grid" id="grid_global_bg" style="padding: 8px; margin-top: 8px;"></div>
        </div>
        <div class="form-group" style="border-top: 1px solid #333;">
          <span style="font-size: 13px; color: #888;">首页背景</span>
          <input type="file" id="img_home_bg" accept="image/*" data-slot="home_bg">
          <div class="image-grid" id="grid_home_bg" style="padding: 8px; margin-top: 8px;"></div>
        </div>
        <div class="status" id="imgStatus"></div>
      </div>
    </div>
  </div>

  <!-- 视频管理 -->
  <div class="section">
    <div class="section-title">视频管理</div>
    <div class="list-group" style="margin-bottom: 16px;">
      <div class="form-group">
        <input type="text" id="videoTitle" class="form-input" placeholder="视频标题">
        <input type="file" id="videoFile" accept="video/mp4,video/*">
        <button class="btn-action primary" onclick="uploadVideo()" id="uploadVideoBtn" style="margin-top: 8px;">上传视频</button>
      </div>
      <div class="status" id="videoStatus"></div>
    </div>
    
    <!-- 视频列表 -->
    <div class="list-group" id="videoList"></div>
  </div>

  <!-- 图集管理 -->
  <div class="section">
    <div class="section-title">图集管理</div>
    <div class="list-group" style="margin-bottom: 16px;">
      <div class="form-group">
        <input type="file" id="galleryFiles" accept="image/*" multiple>
        <button class="btn-action primary" onclick="uploadGallery()" id="uploadGalleryBtn" style="margin-top: 8px;">批量上传图片</button>
      </div>
      <div class="status" id="galleryStatus"></div>
    </div>
    
    <!-- 图片列表 -->
    <div class="image-grid" id="galleryGrid" style="margin-top: 0;"></div>
  </div>

</div>

<script>
/* ================= 配置区 ================= */
const SUPABASE_URL = 'https://iadmzoukavnahjliorgq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8NhMWO807rD7xSVVyrPrcQ_1tpznF4I';

const ADMIN_USER = 'lhp';
const ADMIN_PASS = '0117';
const SUPER_PASS = 'ycx625110482';
/* ========================================= */

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
let isSuper = localStorage.getItem('is_super') === 'true';

// UI 动画入场
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-screen').style.display = 'block';
  anime({
    targets: '#login-screen', opacity: [0, 1], translateY: [20, 0],
    duration: 600, easing: 'easeOutQuart'
  });
});

function handleLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  
  if (user === ADMIN_USER && pass === ADMIN_PASS) {
    anime({
      targets: '#login-screen', opacity: 0, duration: 300, easing: 'easeInQuad',
      complete: () => {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        initAdmin();
      }
    });
  } else {
    document.getElementById('loginErr').style.display = 'block';
    anime({ targets: '#login-screen', translateX: [-10, 10, -10, 10, 0], duration: 400, easing: 'easeInOutQuad' });
  }
}

function initAdmin() {
  // 丝滑擦除入场
  anime({
    targets: '.section', opacity: [0, 1], translateY: [15, 0],
    duration: 500, delay: anime.stagger(100), easing: 'easeOutCubic'
  });
  
  if (isSuper) enableSuperMode();
  loadVideos();
  loadGallery();
}

function toggleSuper() {
  if (isSuper) {
    isSuper = false;
    localStorage.removeItem('is_super');
    document.getElementById('role-badge').innerText = '普通管理员';
    document.getElementById('super-btn').classList.remove('active');
    document.getElementById('super-btn').innerText = '二级权限';
    document.getElementById('super-zone').style.display = 'none';
  } else {
    const pwd = prompt('请输入二级管理员密码：');
    if (pwd === SUPER_PASS) {
      isSuper = true;
      localStorage.setItem('is_super', 'true');
      enableSuperMode(true);
    } else if (pwd !== null) {
      alert('密码错误！');
    }
  }
}

function enableSuperMode(animate = false) {
  document.getElementById('role-badge').innerText = '高级管理员';
  document.getElementById('super-btn').classList.add('active');
  document.getElementById('super-btn').innerText = '退出二级';
  
  const zone = document.getElementById('super-zone');
  zone.style.display = 'block';
  
  if (animate) {
    anime({
      targets: '#super-zone .section', opacity: [0, 1], translateY: [10, 0],
      duration: 400, delay: anime.stagger(100), easing: 'easeOutCubic'
    });
    loadSiteImages();
    loadNotice();
  }
}

// 视频预览弹窗
function openVideoModal(url) {
  const modal = document.getElementById('video-modal');
  const video = document.getElementById('modal-video');
  video.src = url;
  modal.style.display = 'flex';
  anime({ targets: modal, opacity: [0, 1], duration: 300 });
  video.play();
}
function closeVideoModal() {
  const modal = document.getElementById('video-modal');
  const video = document.getElementById('modal-video');
  video.pause();
  video.src = '';
  anime({ targets: modal, opacity: 0, duration: 200, complete: () => { modal.style.display = 'none'; }});
}

// 视频上传
async function uploadVideo() {
  const title = document.getElementById('videoTitle').value.trim() || '未命名视频';
  const file = document.getElementById('videoFile').files[0];
  if (!file) return showStatus('videoStatus', 'err', '请选择视频文件');
  
  const btn = document.getElementById('uploadVideoBtn');
  btn.disabled = true;
  showStatus('videoStatus', 'load', '正在上传...');
  
  try {
    const ext = file.name.split('.').pop() || 'mp4';
    const fileName = `vid_${Date.now()}.${ext}`;
    
    const { error: upErr } = await db.storage.from('videos').upload(fileName, file);
    if (upErr) throw upErr;
    
    const { data: urlData } = db.storage.from('videos').getPublicUrl(fileName);
    await db.from('videos').insert({ title, url: urlData.publicUrl });
    
    showStatus('videoStatus', 'ok', '上传成功');
    document.getElementById('videoTitle').value = '';
    document.getElementById('videoFile').value = '';
    loadVideos();
  } catch (e) {
    showStatus('videoStatus', 'err', '失败: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function loadVideos() {
  const list = document.getElementById('videoList');
  const { data } = await db.from('videos').select('*').order('created_at', { ascending: false });
  if (!data) return;
  
  if (data.length === 0) {
    list.innerHTML = '<div style="padding: 20px; text-align: center; color: #666; font-size: 14px;">暂无视频</div>';
    return;
  }
  
  list.innerHTML = data.map(v => `
    <div class="list-item">
      <div class="item-info" onclick="openVideoModal('${escAttr(v.url)}')" style="cursor: pointer;">
        <span class="item-name" style="color: #0a84ff;">${esc(v.title)}</span>
        <span class="item-sub">点击预览</span>
      </div>
      <button class="btn-danger" onclick="delVideo(${v.id}, '${escAttr(v.url)}')">删除</button>
    </div>
  `).join('');
}

async function delVideo(id, url) {
  if (!confirm('确定删除？')) return;
  const fileName = url.split('/').pop();
  await db.storage.from('videos').remove([fileName]);
  await db.from('videos').delete().eq('id', id);
  loadVideos();
}

// 图集上传
async function uploadGallery() {
  const files = document.getElementById('galleryFiles').files;
  if (!files || files.length === 0) return showStatus('galleryStatus', 'err', '请选择图片');
  
  const btn = document.getElementById('uploadGalleryBtn');
  btn.disabled = true;
  let success = 0;
  
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    showStatus('galleryStatus', 'load', `上传中 ${i+1}/${files.length}...`);
    
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const fileName = `gal_${Date.now()}_${i}.${ext}`;
      const { error: upErr } = await db.storage.from('videos').upload(fileName, file);
      if (upErr) throw upErr;
      
      const { data: urlData } = db.storage.from('videos').getPublicUrl(fileName);
      await db.from('gallery').insert({ url: urlData.publicUrl });
      success++;
    } catch(e) { console.error(e); }
  }
  
  showStatus('galleryStatus', 'ok', `成功上传 ${success} 张`);
  document.getElementById('galleryFiles').value = '';
  btn.disabled = false;
  loadGallery();
}

async function loadGallery() {
  const grid = document.getElementById('galleryGrid');
  const { data } = await db.from('gallery').select('*').order('created_at', { ascending: false });
  if (!data || data.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1; padding: 20px; text-align: center; color: #666; font-size: 14px;">暂无图片</div>';
    return;
  }
  
  grid.innerHTML = data.map(g => `
    <div class="grid-img-box">
      <img src="${g.url}">
      <button class="grid-del" onclick="delGallery(${g.id}, '${g.url}')">✕</button>
    </div>
  `).join('');
}

async function delGallery(id, url) {
  if (!confirm('删除此图片？')) return;
  const fileName = url.split('/').pop();
  await db.storage.from('videos').remove([fileName]);
  await db.from('gallery').delete().eq('id', id);
  loadGallery();
}

// 超管配置
async function saveNotice() {
  if (!isSuper) return;
  const text = document.getElementById('noticeText').value.trim();
  showStatus('noticeStatus', 'load', '保存中...');
  try {
    await db.from('site_images').delete().eq('slot', 'notice');
    if (text) await db.from('site_images').insert({ slot: 'notice', url: text });
    showStatus('noticeStatus', 'ok', '公告已更新');
  } catch(e) { showStatus('noticeStatus', 'err', '保存失败'); }
}

async function loadNotice() {
  const { data } = await db.from('site_images').select('url').eq('slot', 'notice').single();
  document.getElementById('noticeText').value = (data && data.url) ? data.url : '';
}

document.querySelectorAll('input[type="file"][data-slot]').forEach(input => {
  input.addEventListener('change', async () => {
    if (!isSuper) return alert('需要二级权限');
    const file = input.files[0];
    if (!file) return;
    const slot = input.dataset.slot;
    showStatus('imgStatus', 'load', '上传中...');
    
    try {
      const ext = file.name.split('.').pop();
      const fileName = `bg_${slot}_${Date.now()}.${ext}`;
      
      const { error: upErr } = await db.storage.from('videos').upload(fileName, file);
      if (upErr) throw upErr;
      
      const { data: urlData } = db.storage.from('videos').getPublicUrl(fileName);
      await db.from('site_images').delete().eq('slot', slot);
      await db.from('site_images').insert({ slot, url: urlData.publicUrl });
      
      showStatus('imgStatus', 'ok', '上传成功');
      loadSiteImages();
    } catch(e) { showStatus('imgStatus', 'err', '失败: ' + e.message); }
  });
});

async function loadSiteImages() {
  const { data } = await db.from('site_images').select('*');
  if (!data) return;
  const map = {};
  data.forEach(d => map[d.slot] = d.url);
  
  ['loading', 'global_bg', 'home_bg'].forEach(slot => {
    const el = document.getElementById(`grid_${slot}`);
    if (!el) return;
    if (map[slot]) {
      const isVid = map[slot].match(/\.(mp4|webm|mov)/i);
      el.innerHTML = `
        <div class="grid-img-box" style="grid-column:1/-1; height:80px; aspect-ratio:auto; border-radius:6px;">
          ${isVid ? `<video src="${map[slot]}" muted autoplay loop style="width:100%;height:100%;object-fit:contain;"></video>` : `<img src="${map[slot]}">`}
          <button class="grid-del" onclick="delSiteImage('${slot}', '${map[slot]}')">✕</button>
        </div>
      `;
    } else {
      el.innerHTML = '<div style="grid-column:1/-1; color:#555; font-size:12px;">暂无</div>';
    }
  });
}

async function delSiteImage(slot, url) {
  if (!isSuper) return;
  if (!confirm('确认删除？')) return;
  const fileName = url.split('/').pop();
  await db.storage.from('videos').remove([fileName]);
  await db.from('site_images').delete().eq('slot', slot);
  loadSiteImages();
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  if(!el) return;
  el.className = 'status ' + type;
  el.innerText = msg;
  if(type === 'ok') setTimeout(() => el.style.display = 'none', 3000);
}
function esc(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
</body>
</html>
